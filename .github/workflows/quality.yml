name: Site Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify source, build, verify output
        run: npm run check
